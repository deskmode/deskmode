<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buy Plan | DeskMode</title>

<style>
body{font-family:Arial;background:#f5f5f5;}
.container{max-width:400px;margin:50px auto;background:white;padding:20px;border-radius:10px;text-align:center;}
input,select{width:100%;padding:10px;margin:10px 0;}
button{background:#1f7a4c;color:white;padding:10px;border:none;width:100%;}
</style>

</head>
<body>

<div class="container">

<h2>Buy Plan</h2>

<select id="plan">
<option>RDP 4GB</option>
<option>RDP 8GB</option>
<option>RDP 16GB</option>
<option>Live Lite</option>
<option>Live Prime</option>
</select>

<input type="text" id="utr" placeholder="Enter UTR Number">

<button onclick="submitOrder()">Submit Order</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 यहाँ अपना Firebase config डालना है
const firebaseConfig = {
  apiKey: "PASTE_YOUR_REAL_KEY",
  authDomain: "deskmode-987da.firebaseapp.com",
  projectId: "deskmode-987da"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.submitOrder = async function(){

const user = auth.currentUser;

if(!user){
alert("Login first");
return;
}

const plan = document.getElementById("plan").value;
const utr = document.getElementById("utr").value;

await addDoc(collection(db, "orders"), {
  email: user.email,
  plan: plan,
  utr: utr,
  status: "pending",
  time: Date.now()
});

alert("Order Submitted Successfully");

window.location.href = "dashboard.html";

}

</script>

</body>
</html>
