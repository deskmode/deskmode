<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - DeskMode Cloud Computing Services</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f5f5;}

header{
background:#1f7a4c;
color:white;
padding:15px 20px;
}

.header-container{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.logo{
display:flex;
align-items:center;
font-size:22px;
font-weight:bold;
}

.logo img{
width:40px;
margin-right:10px;
}

nav a{
color:white;
text-decoration:none;
margin-left:15px;
font-size:14px;
}

.container{
max-width:420px;
margin:60px auto;
padding:20px;
}

.login-box{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
text-align:center;
}

.login-box h2{
color:#1f7a4c;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:6px;
margin-top:10px;
font-weight:bold;
cursor:pointer;
}

.signup{background:#1f7a4c;color:white;}
.login{background:#444;color:white;}

footer{
background:#1f7a4c;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
font-size:14px;
}

@media(max-width:500px){
.container{margin:30px 15px;}
}

</style>
</head>

<body>

<header>
<div class="header-container">

<div class="logo">
<img src="https://res.cloudinary.com/dc5c4kbb0/image/upload/f_auto,q_auto/v1773733254/file_0000000000a071fd9e3969aaf26939b1_lfbizs.png">
DeskMode
</div>

<nav>
<a href="index.html">Home</a>
<a href="rdp.html">RDP</a>
<a href="live.html">Live</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

</div>
</header>

<div class="container">

<div class="login-box">

<h2>Login / Signup</h2>

<input id="email" placeholder="Enter Email">
<input id="password" type="password" placeholder="Enter Password">

<button class="btn signup" onclick="signup()">Signup</button>
<button class="btn login" onclick="login()">Login</button>

</div>

</div>

<footer>
<p>© 2026 DeskMode Cloud Computing Services. All Rights Reserved.</p>
</footer>

<script>

const supabase = supabase.createClient(
"https://megmdiuvjvpfoungpmgk.supabase.co",
"sb_publishable_VrQ-difnH_hYqG8_CYKeNw_BpHyZYVV"
);

async function signup(){
let { error } = await supabase.auth.signUp({
email: email.value,
password: password.value
});

if(error){
alert(error.message);
}else{
alert("Signup Success");
}
}

async function login(){
let { error } = await supabase.auth.signInWithPassword({
email: email.value,
password: password.value
});

if(error){
alert(error.message);
}else{
window.location="dashboard.html";
}
}

</script>

</body>
</html>
