<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | DeskMode</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f5f5;}

header{
background:#1f7a4c;
color:white;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

nav{
display:flex;
justify-content:center;
gap:15px;
margin-top:8px;
flex-wrap:wrap;
}
nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.container{
display:flex;
justify-content:center;
align-items:center;
min-height:80vh;
padding:20px;
}

.box{
background:white;
padding:25px;
width:100%;
max-width:350px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
text-align:center;
}

.box h2{
color:#1f7a4c;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
font-weight:bold;
}

.signup{background:#1f7a4c;color:white;}
.login{background:#444;color:white;}

footer{
background:#1f7a4c;
color:white;
text-align:center;
padding:15px;
font-size:13px;
}
</style>
</head>

<body>

<header>
DeskMode
<nav>
<a href="index.html">Home</a>
<a href="rdp.html">RDP</a>
<a href="live.html">Live</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<div class="container">
<div class="box">

<h2>Login / Signup</h2>

<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">

<button class="signup" onclick="signup()">Signup</button>
<button class="login" onclick="login()">Login</button>

</div>
</div>

<footer>
© 2026 DeskMode Cloud Computing Services
</footer>

<!-- ✅ FIREBASE SCRIPT -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQqwkPXtsxae2EBvnZ31suresOkLJUBSc",
  authDomain: "deskmode-987da.firebaseapp.com",
  projectId: "deskmode-987da",
  storageBucket: "deskmode-987da.firebasestorage.app",
  messagingSenderId: "215318493421",
  appId: "1:215318493421:web:f725eeff8eace165b7b4e4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// SIGNUP
window.signup = function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => alert("Signup Successful"))
    .catch(err => alert(err.message));
}

// LOGIN
window.login = function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Login Successful");
      window.location.href = "dashboard.html";
    })
    .catch(err => alert(err.message));
}

</script>

</body>
</html>
