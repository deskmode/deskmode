<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Live</title>

<style>
body{font-family:Arial;background:#f5f5f5;}
.box{max-width:400px;margin:40px auto;background:white;padding:20px;border-radius:10px;text-align:center;}
input,select{width:100%;padding:10px;margin:10px 0;}
button{background:#1f7a4c;color:white;padding:10px;border:none;width:100%;}
.price{font-weight:bold;color:#1f7a4c;}
</style>
</head>

<body>

<div class="box">

<h2>Buy Live Streaming</h2>

<select id="quality" onchange="calcPrice()">
<option value="49">360p Demo</option>
<option value="299">360p Monthly</option>
<option value="599">480p Monthly</option>
<option value="1099">HD Monthly</option>
<option value="1999">Full HD Monthly</option>
</select>

<select id="duration" onchange="calcPrice()">
<option value="1">1 Day</option>
<option value="30">30 Days</option>
</select>

<p class="price">Price: ₹<span id="price">49</span></p>

<input type="text" id="stream" placeholder="Stream Key / Link">
<input type="text" id="media" placeholder="Google Drive Media Link">
<input type="text" id="utr" placeholder="Enter UTR Number">

<button onclick="submitLive()">Submit</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "YOUR KEY",
  authDomain: "deskmode-987da.firebaseapp.com",
  projectId: "deskmode-987da"
});

const db = getFirestore(app);
const auth = getAuth(app);

// 🔥 PRICE CALCULATION
window.calcPrice = function(){
let quality = parseInt(document.getElementById("quality").value);
let duration = parseInt(document.getElementById("duration").value);

let price = (quality / 30) * duration;

document.getElementById("price").innerText = Math.round(price);
}

window.submitLive = async function(){

const user = auth.currentUser;
if(!user){ alert("Login first"); return; }

await addDoc(collection(db, "orders"), {
  email: user.email,
  type: "LIVE",
  quality: document.getElementById("quality").value,
  duration: document.getElementById("duration").value,
  stream: document.getElementById("stream").value,
  media: document.getElementById("media").value,
  utr: document.getElementById("utr").value,
  status: "pending",
  time: Date.now()
});

alert("Live Order Submitted");

}

</script>

</body>
</html>
