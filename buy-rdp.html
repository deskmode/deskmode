<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy RDP</title>

<style>
body{font-family:Arial;background:#f5f5f5;}
.box{max-width:400px;margin:40px auto;background:white;padding:20px;border-radius:10px;text-align:center;}
input,select{width:100%;padding:10px;margin:10px 0;}
button{background:#1f7a4c;color:white;padding:10px;border:none;width:100%;}
</style>
</head>

<body>

<div class="box">

<h2>Buy RDP</h2>

<select id="ram">
<option>4GB - ₹299</option>
<option>8GB - ₹399</option>
<option>16GB - ₹499</option>
<option>32GB - ₹999</option>
</select>

<input type="text" id="utr" placeholder="Enter UTR Number">

<button onclick="submitRDP()">Submit</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "YOUR KEY",
  authDomain: "deskmode-987da.firebaseapp.com",
  projectId: "deskmode-987da"
});

const db = getFirestore(app);
const auth = getAuth(app);

window.submitRDP = async function(){

const user = auth.currentUser;
if(!user){ alert("Login first"); return; }

const ram = document.getElementById("ram").value;
const utr = document.getElementById("utr").value;

await addDoc(collection(db, "orders"), {
  email: user.email,
  type: "RDP",
  ram: ram,
  utr: utr,
  status: "pending",
  time: Date.now()
});

alert("RDP Order Submitted");
}

</script>

</body>
</html>
