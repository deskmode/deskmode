<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy RDP</title>

<style>
body{font-family:Arial;background:#f5f5f5;}
.box{max-width:400px;margin:40px auto;background:white;padding:20px;border-radius:10px;text-align:center;}
input,select{width:100%;padding:10px;margin:10px 0;}
button{background:#1f7a4c;color:white;padding:10px;border:none;width:100%;}
</style>
</head>

<body>

<div class="box">

<h2>Buy RDP</h2>

<select id="ram">
<option>4GB - ₹499</option>
<option>8GB - ₹599</option>
<option>16GB - ₹699</option>
<option>32GB - ₹1199</option>
</select>

<input type="text" id="utr" placeholder="Enter UTR Number">

<button onclick="submitRDP()">Submit</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQqwkPXtsxae2EBvnZ31suresOkLJUBSc",
  authDomain: "deskmode-987da.firebaseapp.com",
  projectId: "deskmode-987da",
  storageBucket: "deskmode-987da.firebasestorage.app",
  messagingSenderId: "215318493421",
  appId: "1:215318493421:web:f725eeff8eace165b7b4e4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// 🔥 STEP 1: URL से plan पकड़ना (TOP में रखना जरूरी)
const urlParams = new URLSearchParams(window.location.search);
const selectedPlan = urlParams.get("plan");

window.addEventListener("DOMContentLoaded", () => {
  if(selectedPlan){
    document.getElementById("ram").value = selectedPlan;
  }
});


// 🔥 STEP 2: ORDER SUBMIT
window.placeOrder = async function(){

  const user = auth.currentUser;
  if(!user){
    alert("Login first");
    return;
  }

  const ram = document.getElementById("ram").value;
  const utr = document.getElementById("utr").value;

  if(!utr){
    alert("Enter UTR number");
    return;
  }

  await addDoc(collection(db, "orders"), {
    email: user.email,
    type: "RDP",
    ram: ram,
    utr: utr,
    status: "pending",
    time: Date.now()
  });

  alert("Order Submitted ✅");

};

</script>

// URL से plan पकड़ना
const urlParams = new URLSearchParams(window.location.search);
const selectedPlan = urlParams.get("plan");

if(selectedPlan){
document.getElementById("ram").value = selectedPlan;
}

  </script>

</body>
</html>
