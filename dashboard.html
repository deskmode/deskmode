<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | DeskMode</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

header{
background:#1f7a4c;
color:white;
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.container{
padding:20px;
text-align:center;
}

.box{
background:white;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.logout{
margin-top:20px;
padding:10px;
background:red;
color:white;
border:none;
border-radius:6px;
width:100%;
}
</style>
</head>

<body>

<header>Dashboard</header>

<div class="container">
<div class="box">

<h2>Welcome to DeskMode</h2>

<p id="userEmail"></p>

<button class="logout" onclick="logout()">Logout</button>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQqwkPXtsxae2EBvnZ31suresOkLJUBSc",
  authDomain: "deskmode-987da.firebaseapp.com",
  projectId: "deskmode-987da",
  storageBucket: "deskmode-987da.firebasestorage.app",
  messagingSenderId: "215318493421",
  appId: "1:215318493421:web:f725eeff8eace165b7b4e4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if(user){
    document.getElementById("userEmail").innerText = user.email;
  }else{
    window.location.href = "login.html";
  }
});

window.logout = function(){
  signOut(auth).then(()=>{
    window.location.href = "login.html";
  });
}

</script>

</body>
</html>
