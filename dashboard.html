<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | DeskMode</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{background:#f5f5f5;}

/* HEADER */
header{
background:#1f7a4c;
color:white;
padding:15px 20px;
}

.header-container{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
}

.logo{
display:flex;
align-items:center;
font-size:22px;
font-weight:bold;
}

.logo img{
width:35px;
margin-right:10px;
}

nav a{
color:white;
text-decoration:none;
margin-left:15px;
font-size:14px;
}

/* DASHBOARD */
.container{
max-width:1100px;
margin:40px auto;
padding:20px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
margin-bottom:20px;
}

.card h2{
color:#1f7a4c;
margin-bottom:10px;
}

/* USER BOX */
.user-box{
text-align:center;
}

.user-box p{
margin-top:10px;
color:#444;
}

/* BUTTON */
.logout{
margin-top:20px;
padding:12px;
background:red;
color:white;
border:none;
border-radius:6px;
width:100%;
font-weight:bold;
}

/* FOOTER */
footer{
background:#1f7a4c;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
font-size:14px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
<div class="header-container">

<div class="logo">
<img src="https://res.cloudinary.com/dc5c4kbb0/image/upload/f_auto,q_auto/v1773733254/file_0000000000a071fd9e3969aaf26939b1_lfbizs.png">
DeskMode
</div>

<nav>
<a href="index.html">Home</a>
<a href="rdp.html">RDP</a>
<a href="live.html">Live</a>
<a href="contact.html">Contact</a>
</nav>

</div>
</header>

<!-- DASHBOARD -->
<div class="container">

<div class="card user-box">
<h2>Welcome to DeskMode</h2>
<p id="userEmail"></p>

<button class="logout" onclick="logout()">Logout</button>
</div>

<!-- FUTURE: RDP DETAILS -->
<div class="card">
<h2>Your Service Details</h2>

<p>Plan: <span id="plan">Not Assigned</span></p>
<p>IP Address: <span id="ip">-</span></p>
<p>Username: <span id="username">-</span></p>
<p>Password: <span id="password">-</span></p>
<p>Expiry Date: <span id="expiry">-</span></p>

</div>

</div>

<!-- FOOTER -->
<footer>
© 2026 DeskMode Cloud Computing Services
</footer>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQqwkPXtsxae2EBvnZ31suresOkLJUBSc",
  authDomain: "deskmode-987da.firebaseapp.com",
  projectId: "deskmode-987da",
  storageBucket: "deskmode-987da.firebasestorage.app",
  messagingSenderId: "215318493421",
  appId: "1:215318493421:web:f725eeff8eace165b7b4e4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// USER CHECK
onAuthStateChanged(auth, (user) => {
  if(user){
    document.getElementById("userEmail").innerText = user.email;
  }else{
    window.location.href = "login.html";
  }
});

// LOGOUT
window.logout = function(){
  signOut(auth).then(()=>{
    window.location.href = "login.html";
  });
}

</script>

</body>
</html>
